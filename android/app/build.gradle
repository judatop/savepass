plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
     keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.juda.savepass"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.juda.savepass"
        manifestPlaceholders = [
            appAuthScheme: "savepass"
        ]
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties["keyAlias"] as String
            keyPassword = keystoreProperties["keyPassword"] as String
            def storeFilePath = keystoreProperties["storeFile"]
            if (storeFilePath != null) {
                storeFile = file(storeFilePath)
            }
            storePassword = keystoreProperties["storePassword"] as String
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.getByName("release")
        }
    }

    flavorDimensions += "default"
    productFlavors {
        dev {
            dimension "default"
            resValue "string", "app_name", "SavePassDev"
            applicationId = "com.juda.savepassdev"
            manifestPlaceholders = [
                appAuthScheme: "savepassdev",
                appAuthHost: "com.juda.savepassdev"
            ]
        }
        prod {
            dimension "default"
            resValue "string", "app_name", "SavePass"
            applicationId "com.juda.savepass"
            manifestPlaceholders = [
                appAuthScheme: "savepass",
                appAuthHost: "com.juda.savepass"
            ]
        }
    }
}

// Refuses to build a flavor whose secrets are not the ones compiled into
// lib/core/env/env.g.dart. build.sh writes .envied.lock after codegen.
def verifyEnvMatchesFlavor = { String flavorName ->
    def projectRoot = file("${project.rootDir}/..")
    def lock = new File(projectRoot, ".envied.lock")
    def envFile = new File(projectRoot, ".env.${flavorName}")

    if (!lock.exists()) {
        throw new GradleException(
            "Missing .envied.lock - env.g.dart was not generated by build.sh.\n" +
            "  Run: ./build.sh ${flavorName}")
    }

    def lines = lock.readLines()
    def lockedDigest = lines.size() > 0 ? lines[0].trim() : ""
    def lockedFlavor = lines.size() > 1 ? lines[1].trim() : ""

    if (lockedFlavor != flavorName) {
        throw new GradleException(
            "Flavor mismatch: building '${flavorName}' but env.g.dart holds '${lockedFlavor}' secrets.\n" +
            "  Run: ./build.sh ${flavorName}")
    }

    if (!envFile.exists()) {
        throw new GradleException("Missing .env.${flavorName}")
    }

    def digest = java.security.MessageDigest.getInstance("MD5")
        .digest(envFile.bytes).encodeHex().toString()

    if (digest != lockedDigest) {
        throw new GradleException(
            ".env.${flavorName} changed since env.g.dart was generated.\n" +
            "  Run: ./build.sh ${flavorName}")
    }
}

// AGP runs every flavor's pre<Flavor><BuildType>Build task as a lifecycle
// anchor, so those cannot tell us what is being built. The task graph can.
gradle.taskGraph.whenReady { graph ->
    def flavorsBeingBuilt = [] as Set
    graph.allTasks.each { t ->
        if (t.project == project) {
            def matcher = (t.name =~ /^(?:assemble|bundle)(Dev|Prod)(Debug|Release)$/)
            if (matcher.matches()) {
                flavorsBeingBuilt << matcher.group(1).toLowerCase()
            }
        }
    }
    flavorsBeingBuilt.each { verifyEnvMatchesFlavor(it) }
}

flutter {
    source '../..'
}

dependencies {}
